<title>Yük Ağı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<style>
/* Layout: sabit üst bar + solda rol menüsü, dar ekranda tek sütuna iner.
   Palet: koyu çam yeşili (yol tabelası), kireç beyazı yüzeyler, kehribar uyarı. */
:root{
  --bg:#F4F6F2; --surface:#FFFFFF; --surface-2:#EBEFE8; --surface-3:#E1E7DD;
  --ink:#0E1613; --ink-2:#56635B; --ink-3:#87958B;
  --line:#DFE5DA; --line-2:#CBD4C5;
  --pine:#12604A; --pine-2:#0A2E22; --pine-soft:#E4EFE9; --lime:#1FA176;
  --amber:#A86A14; --amber-soft:#FAEFDC;
  --rust:#9E3326; --rust-soft:#FAE8E5;
  --shadow:0 1px 2px rgba(14,22,19,.06);
  --shadow-lift:0 14px 34px -20px rgba(10,46,34,.45);
  --disp:"Barlow Condensed","Barlow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --r-lg:16px;
  --bar:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090D0B; --surface:#111714; --surface-2:#161E1A; --surface-3:#1D2721;
    --ink:#E7EDE8; --ink-2:#96A49B; --ink-3:#6C7A72;
    --line:#1F2A24; --line-2:#2B3730;
    --pine:#2D9C76; --pine-2:#0C241C; --pine-soft:#11231C; --lime:#3FD6A4;
    --amber:#D2993F; --amber-soft:#231A0C;
    --rust:#DE7568; --rust-soft:#271310;
    --shadow:0 1px 2px rgba(0,0,0,.5);
    --shadow-lift:0 16px 40px -22px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090D0B; --surface:#111714; --surface-2:#161E1A; --surface-3:#1D2721;
  --ink:#E7EDE8; --ink-2:#96A49B; --ink-3:#6C7A72;
  --line:#1F2A24; --line-2:#2B3730;
  --pine:#2D9C76; --pine-2:#0C241C; --pine-soft:#11231C; --lime:#3FD6A4;
  --amber:#D2993F; --amber-soft:#231A0C;
  --rust:#DE7568; --rust-soft:#271310;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  --shadow-lift:0 16px 40px -22px rgba(0,0,0,.9);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--pine-2)}
h1,h2,h3{font-family:var(--disp);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:1.75rem}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- üst bar ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--pine-2); color:#E3F0E9; min-height:var(--bar);
}
.topbar .inner{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:1.22rem;font-weight:700;letter-spacing:.01em;color:#fff}
.brand svg{flex:0 0 24px}
.spacer{flex:1 1 auto}
.rolepick{display:flex;align-items:center;gap:7px;min-width:0}
.rolepick label{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:#92AFA1;white-space:nowrap}
select.role{
  background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.18);
  border-radius:8px; padding:7px 9px; font-size:.88rem; font-weight:600; max-width:100%;
}
select.role option{color:#111;background:#fff}
.langs{display:flex;gap:3px}
.langs button{
  background:transparent;border:1px solid rgba(255,255,255,.2);color:#9FBBAD;
  border-radius:7px;padding:5px 9px;font-size:.78rem;font-weight:700;cursor:pointer;
}
.langs button[aria-pressed="true"]{background:#fff;color:var(--pine-2);border-color:#fff}

.notice{background:var(--amber-soft);border-bottom:1px solid var(--line)}
.notice .inner{
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  color:var(--amber); font-size:.84rem; display:flex; gap:8px; align-items:flex-start;
}
.notice svg{flex:0 0 15px;margin-top:4px}

/* ---------- kabuk ---------- */
.shell{
  display:grid; grid-template-columns:216px minmax(0,1fr); gap:22px;
  max-width:1180px; margin:0 auto;
  padding-block:20px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
@media (max-width:820px){ .shell{grid-template-columns:1fr;gap:14px} }

nav.side{display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px) + 50px)}
@media (max-width:820px){
  nav.side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}
}
nav.side button{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:transparent;border:1px solid transparent;border-radius:9px;
  padding:9px 11px;text-align:left;cursor:pointer;color:var(--ink-2);
  font-weight:600;font-size:.92rem;white-space:nowrap;
}
nav.side button:hover{background:var(--surface-2)}
nav.side button[aria-current="true"]{background:var(--pine-soft);color:var(--pine);border-color:color-mix(in srgb,var(--pine) 22%,transparent)}
nav.side .count{font-size:.74rem;font-weight:700;background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:1px 7px}

main{min-width:0}
.head{margin-bottom:16px}
.head p{color:var(--ink-2);margin-top:5px;max-width:64ch;font-size:.94rem}

/* ---------- parçalar ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.route{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-size:1.3rem;font-weight:600;min-width:0}
.route svg{color:var(--pine);flex:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.ok{background:var(--pine-soft);color:var(--pine);border-color:transparent}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.bad{background:var(--rust-soft);color:var(--rust);border-color:transparent}
.chip.lock{background:var(--surface-3);color:var(--ink-2);border-color:transparent}

.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-2)}
.kv b{text-align:right}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--pine);color:#fff;border:1px solid transparent;border-radius:8px;
  padding:9px 14px;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;
}
.btn:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.quiet:hover{background:var(--surface-2);filter:none}
.btn.soft{background:var(--pine-soft);color:var(--pine)}
.btn.sm{padding:6px 11px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.price{font-family:var(--disp);font-size:1.3rem;font-weight:700}
.perkm{font-size:.75rem;color:var(--ink-3)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:11px;border-top:1px solid var(--line)}

.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile b{display:block;font-family:var(--disp);font-size:1.75rem;line-height:1}
.tile span{font-size:.78rem;color:var(--ink-3)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:540px;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
tr:last-child td{border-bottom:0}

.filters{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:.72rem;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.field select,.field input,.field textarea{
  background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:8px 9px;font:inherit;font-size:.9rem;width:100%;
}

.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--disp);font-size:1.2rem;color:var(--ink);margin-bottom:5px}

.lockbox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:13px;display:flex;gap:10px;align-items:flex-start}
.lockbox svg{flex:0 0 16px;margin-top:3px;color:var(--ink-3)}
.lockbox p{font-size:.88rem;color:var(--ink-2)}

.split{display:grid;gap:14px;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
@media (max-width:760px){ .split{grid-template-columns:1fr} }

.qrwrap{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.qrcard{background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow-lift);display:flex;flex-direction:column;align-items:center;gap:9px}
.qrcard canvas{display:block;width:176px;height:176px;max-width:100%}
.qrcard .nm{font-family:var(--disp);font-size:1.05rem;font-weight:700;color:#0E1613}
.qrcard .sub{font-size:.72rem;color:#56635B;letter-spacing:.04em}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;
  background:var(--pine-2);color:#E3F0E9;border-radius:99px;
  padding:10px 16px;font-size:.88rem;box-shadow:var(--shadow-lift);
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .22s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

function teklifGorebilir(i){
  if(rol==="adm") return true;
  var f=benimFirmam();
  if(i.firma===f) return true;
  return (i.teklifler||[]).some(function(t){ return t.firma===f; });
}

  var durChip = (i.durum!=="yayinda") ? '<span class="chip '+(i.durum==="tamamlandi"?"":"warn")+'">'+t.durum[i.durum]+'</span>' : "";

  if(filtre.sort==="fiyat") liste.sort(function(a,b){return b.fiyat-a.fiyat;});

      '<div class="tile"><b class="tnum">'+(fr.deneme||"—")+'</b><span>'+t.kalanGun+'</span></div>'+
      '<div class="tile"><b class="tnum">'+CALISANLAR.length+'</b><span>'+t.calisanSayi+'</span></div>'+
    '</div>'+
    '<div class="split">'+
      '<div class="card">'+
        '<h3 style="margin-bottom:8px">'+esc(fr.ad)+'</h3>'+
        '<div class="chips" style="margin-bottom:10px">'+
          (fr.dogrulandi?'<span class="chip ok">✓ '+t.dogrulanmis+'</span>':'<span class="chip warn">'+t.dogrulanmamis+'</span>')+
          '<span class="chip">'+esc(fr.sehir)+'</span>'+
          '<span class="chip ok">'+t.durum.onayli+'</span>'+
        '</div>'+
        '<div class="kv"><span>'+t.paket+'</span><b>'+esc(L(plan.ad))+'</b></div>'+
        '<div class="kv"><span>'+t.denemeBitis+'</span><b>'+(lang==="tr"?"8 Kasım 2026":"8 November 2026")+'</b></div>'+
        '<div class="kv"><span>'+t.limitIlan+'</span><b class="tnum">'+aktif+' / '+plan.ilan+'</b></div>'+
        '<div class="kv"><span>'+t.limitCalisan+'</span><b class="tnum">'+CALISANLAR.length+' / '+plan.calisan+'</b></div>'+
      '</div>'+
      '<div class="card">'+
        '<h3 style="margin-bottom:6px">'+esc(L(plan.ad))+'</h3>'+
        '<div class="price tnum">'+tl(plan.fiyat)+' <span style="font-family:var(--body);font-size:.85rem;font-weight:500;color:var(--ink-2)">/ '+t.aylik+'</span></div>'+
        '<p style="font-size:.8rem;color:var(--ink-3);margin-top:3px">'+t.kdvHaric+'</p>'+
        '<div class="lockbox" style="margin-top:12px">'+kilit()+'<p>'+t.notice+'</p></div>'+
      '</div>'+
    '</div>';
}

/* --------- yönetim --------- */
function ekranOnay(){
  var t=T(), bek=Object.keys(FIRMALAR).filter(function(k){ return FIRMALAR[k].durum==="beklemede"; });
  return bas(t.onayH,t.onayP)+(bek.length
    ? '<div class="grid">'+bek.map(function(k){
        var f=FIRMALAR[k];
        return '<div class="card"><h3>'+esc(f.ad)+'</h3>'+
          '<div class="chips" style="margin:8px 0"><span class="chip warn">'+t.durum.beklemede+'</span>'+
          '<span class="chip">'+esc(f.sehir)+'</span>'+
          '<span class="chip">'+esc(f.tur==="loj"?(lang==="tr"?"Lojistik":"Logistics"):(lang==="tr"?"Yük veren":"Shipper"))+'</span></div>'+
          '<div class="foot"><button class="btn sm" data-ac="onayla" data-k="'+k+'">'+t.onayla+'</button>'+
          '<span class="perkm">'+(lang==="tr"?"30 gün deneme başlar":"starts a 30-day trial")+'</span></div></div>';
      }).join("")+'</div>'
    : '<div class="empty"><b>'+(lang==="tr"?"Onay kuyruğu boş":"The queue is empty")+'</b><p>'+t.onayP+'</p></div>');
}

function ekranFirmalar(){
  var t=T();
  return bas(t.firmalarH,t.firmalarP)+
    '<div class="tablewrap"><table><thead><tr>'+
      '<th>'+(lang==="tr"?"Firma":"Company")+'</th><th>'+(lang==="tr"?"Tür":"Type")+'</th>'+
      '<th>'+(lang==="tr"?"Şehir":"City")+'</th><th>'+(lang==="tr"?"Durum":"Status")+'</th>'+
      '<th>'+(lang==="tr"?"Doğrulama":"Verification")+'</th></tr></thead><tbody>'+
    Object.keys(FIRMALAR).map(function(k){
      var f=FIRMALAR[k];
      var tur = f.tur==="loj"?(lang==="tr"?"Lojistik":"Logistics"):f.tur==="nak"?(lang==="tr"?"Nakliyeci":"Carrier"):(lang==="tr"?"Yük veren":"Shipper");
      return '<tr><td><b>'+esc(f.ad)+'</b></td><td>'+tur+'</td><td>'+esc(f.sehir)+'</td>'+
        '<td><span class="chip '+(f.durum==="onayli"?"ok":"warn")+'">'+t.durum[f.durum]+'</span></td>'+
        '<td>'+(f.dogrulandi?'<span class="chip ok">✓</span>':'<span class="chip warn">'+t.dogrulanmamis+'</span>')+'</td></tr>';
    }).join("")+'</tbody></table></div>';
}

function ekranAbonelik(){
  var t=T();
  return bas(t.abonelikH,t.abonelikP)+
    '<div class="grid" style="margin-bottom:14px">'+PLANLAR.map(function(p){
      return '<div class="card"><h3>'+esc(L(p.ad))+'</h3>'+
        '<div class="price tnum" style="margin:6px 0 2px">'+tl(p.fiyat)+' <span style="font-family:var(--body);font-size:.85rem;font-weight:500;color:var(--ink-2)">/ '+t.aylik+'</span></div>'+
        '<p style="font-size:.78rem;color:var(--ink-3)">'+t.kdvHaric+'</p>'+
        '<div style="margin-top:10px"><div class="kv"><span>'+t.limitCalisan+'</span><b class="tnum">'+p.calisan+'</b></div>'+
        '<div class="kv"><span>'+t.limitIlan+'</span><b class="tnum">'+p.ilan+'</b></div></div></div>';
    }).join("")+'</div>'+
    '<div class="tablewrap"><table><thead><tr><th>'+(lang==="tr"?"Firma":"Company")+'</th><th>'+t.paket+'</th>'+
      '<th>'+(lang==="tr"?"Durum":"Status")+'</th><th>'+t.denemeBitis+'</th></tr></thead><tbody>'+
    Object.keys(FIRMALAR).filter(function(k){return FIRMALAR[k].durum==="onayli";}).map(function(k){
      var f=FIRMALAR[k];
      var den=f.deneme?('<span class="chip warn">'+f.deneme+' '+t.kalanGun+'</span>'):'<span class="chip">'+(lang==="tr"?"Ücretsiz kullanım":"Free tier")+'</span>';
      return '<tr><td><b>'+esc(f.ad)+'</b></td><td>'+esc(f.plan)+'</td><td>'+den+'</td>'+
        '<td class="tnum">'+(f.deneme?(lang==="tr"?"8 Kasım 2026":"8 Nov 2026"):"—")+'</td></tr>';
    }).join("")+'</tbody></table></div>';
}

function ekranGelir(){
  var t=T();
  return bas(t.gelirH,t.gelirP)+
    '<div class="tiles" style="margin-bottom:14px">'+
      '<div class="tile"><b class="tnum">'+tl(0)+'</b><span>'+(lang==="tr"?"Bu ayki gelir":"Revenue this month")+'</span></div>'+
      '<div class="tile"><b class="tnum">1</b><span>'+(lang==="tr"?"Denemedeki firma":"Companies in trial")+'</span></div>'+
      '<div class="tile"><b class="tnum">4</b><span>'+(lang==="tr"?"Onaylı firma":"Approved companies")+'</span></div>'+
      '<div class="tile"><b class="tnum">0</b><span>'+(lang==="tr"?"Ücretli abone":"Paying subscribers")+'</span></div>'+
    '</div>'+
    '<div class="empty"><b>'+t.gelirYok+'</b><p>'+t.gelirYokP+'</p></div>';
}

function ekranKayit(){
  var t=T();
  return bas(t.kayitH,t.kayitP)+
    '<div class="tablewrap"><table><thead><tr><th>'+(lang==="tr"?"Zaman":"Time")+'</th>'+
      '<th>'+(lang==="tr"?"Kim":"Who")+'</th><th>'+(lang==="tr"?"İşlem":"Action")+'</th>'+
      '<th>'+(lang==="tr"?"Hedef":"Target")+'</th></tr></thead><tbody>'+
    KAYITLAR.map(function(k){
      return '<tr><td style="color:var(--ink-2)">'+esc(L(k.z))+'</td><td><b>'+esc(k.kim)+'</b></td>'+
        '<td>'+esc(L(k.ne))+'</td><td style="color:var(--ink-2)">'+esc(k.hedef)+'</td></tr>';
    }).join("")+'</tbody></table></div>'+
    '<div class="lockbox" style="margin-top:12px">'+kilit()+'<p>'+t.kayitP+'</p></div>';
}

/* --------- ilan detayı --------- */
function ekranDetay(){
  var t=T(), i=null;
  for(var x=0;x<ILANLAR.length;x++) if(ILANLAR[x].id===acikIlan) i=ILANLAR[x];
  if(!i) { ekran="bul"; return ekranBul(); }
  var k=km(i.to), sahibi=(i.firma===benimFirmam()), gor=teklifGorebilir(i);

  var teklifBlok;
  if(gor){
    var lst=i.teklifler||[];
    teklifBlok='<div class="card"><h3 style="margin-bottom:8px">'+(lang==="tr"?"Teklifler":"Offers")+' ('+lst.length+')</h3>'+
      (lst.length? lst.map(function(tk){
        return '<div class="kv"><div><b>'+esc(FIRMALAR[tk.firma].ad)+'</b>'+
          '<div style="font-size:.82rem;color:var(--ink-2)">'+esc(L(tk.not))+'</div></div>'+
          '<div style="text-align:right"><b class="tnum">'+tl(tk.tutar)+'</b>'+
          '<div><span class="chip '+(tk.durum==="kabul"?"ok":tk.durum==="red"?"bad":"warn")+'">'+t.tDurum[tk.durum]+'</span></div></div></div>';
      }).join("") : '<p style="font-size:.9rem;color:var(--ink-2)">'+t.bosTeklifP+'</p>')+
    '</div>';
  } else {
    teklifBlok='<div class="lockbox">'+kilit()+'<p>'+t.gizliAcik+'</p></div>';
  }

  var aksiyon = (!sahibi && rol!=="adm" && i.durum==="yayinda")
    ? (teklifFormu===i.id
        ? '<form class="card" id="teklifForm" style="margin-top:12px">'+
          '<h3 style="margin-bottom:10px">'+t.teklifVer+'</h3>'+
          '<div class="field" style="margin-bottom:9px"><label for="tfT">'+t.tutar+'</label>'+
            '<input id="tfT" type="number" inputmode="numeric" value="'+Math.round(i.fiyat*0.96)+'" required></div>'+
          '<div class="field" style="margin-bottom:11px"><label for="tfN">'+t.not+'</label>'+
            '<textarea id="tfN" rows="2" placeholder="'+esc(t.notPh)+'"></textarea></div>'+
          '<div class="row"><button class="btn" type="submit">'+t.teklifGonder+'</button>'+
          '<button class="btn quiet" type="button" data-ac="iptal">'+t.vazgec+'</button></div></form>'
        : '<button class="btn" style="margin-top:12px" data-ac="teklif" data-id="'+i.id+'">'+t.teklifVer+'</button>')
    : "";

  return '<button class="btn quiet sm" data-ac="geri" style="margin-bottom:12px">← '+t.geri+'</button>'+
    '<div class="split">'+
      '<div class="stack">'+
        '<div class="card">'+
          '<div class="route" style="font-size:1.6rem">'+esc("Denizli")+ok()+esc(i.to)+'</div>'+
          '<div class="chips" style="margin:10px 0">'+
            (FIRMALAR[i.firma].dogrulandi?'<span class="chip ok">✓ '+t.dogrulanmis+'</span>':'<span class="chip warn">'+t.dogrulanmamis+'</span>')+
            '<span class="chip">'+esc(dorseAd(i.dorse))+'</span>'+
            '<span class="chip">'+i.ton+' '+t.ton+'</span>'+
            '<span class="chip">'+esc(L(i.ne))+'</span>'+
            (sahibi?'<span class="chip '+(i.gor==="pazar"?"ok":"warn")+'">'+t.gorunurluk[i.gor]+'</span>':"")+
          '</div>'+
          '<div class="kv"><span>'+t.yukCinsi+'</span><b>'+esc(L(i.cargo))+'</b></div>'+
          '<div class="kv"><span>'+t.mesafe+'</span><b class="tnum">'+k+' '+t.km+'</b></div>'+
          '<div class="kv"><span>'+t.istenenFiyat+'</span><b class="tnum">'+tl(i.fiyat)+'</b></div>'+
          '<div class="kv"><span>'+t.kmBasi+'</span><b class="tnum">'+tl(perkm(i.fiyat,k))+'</b></div>'+
          '<div class="kv"><span>'+t.ilanNo+'</span><b>'+esc(i.id)+'</b></div>'+
          '<div class="kv"><span>'+t.yayin+'</span><b>'+esc(L(i.posted))+'</b></div>'+
          '<h3 style="margin-top:14px">'+t.aciklama+'</h3>'+
          '<p style="color:var(--ink-2);margin-top:5px;font-size:.93rem">'+esc(L(i.not))+'</p>'+
          aksiyon+
        '</div>'+
      '</div>'+
      '<div class="stack">'+teklifBlok+
        '<div class="card"><div class="kv"><span>'+(lang==="tr"?"İlan sahibi":"Listing owner")+'</span><b>'+esc(FIRMALAR[i.firma].ad)+'</b></div>'+
        '<div class="kv"><span>'+(lang==="tr"?"Telefon":"Phone")+'</span><b>'+
          (gor||i.gor==="pazar" ? "0532 418 22 90" : '<span class="chip lock">'+(lang==="tr"?"Giriş gerekli":"Sign-in required")+'</span>')+'</b></div>'+
        '</div>'+
      '</div>'+
    '</div>';
}

function bas(h,p){ return '<div class="head"><h1>'+esc(h)+'</h1><p>'+esc(p)+'</p></div>'; }

/* ===================== çizim ===================== */
var EKRANLAR={bul:ekranBul, ilanlar:ekranIlanlarim, teklifler:ekranTeklifler, benimTeklif:ekranBenimTeklif,
  isler:ekranIsler, calisan:ekranCalisan, qr:ekranQR, firma:ekranFirma,
  onay:ekranOnay, firmalar:ekranFirmalar, abonelik:ekranAbonelik, gelir:ekranGelir, kayit:ekranKayit};

function ciz(){
  var t=T();
  document.getElementById("brandName").textContent=t.brand;
  document.getElementById("roleLbl").textContent=t.roleLbl;
  document.getElementById("noticeTxt").textContent=t.notice;
  document.documentElement.lang=lang;

  var rs=document.getElementById("roleSel");
  rs.innerHTML=["loj","yuk","nak","adm"].map(function(r){
    return '<option value="'+r+'"'+(r===rol?' selected':'')+'>'+esc(t.roles[r])+'</option>';}).join("");

  var menu=MENU[rol];
  if(menu.indexOf(ekran)<0 && ekran!=="detay") ekran=menu[0];
  var bekSay=Object.keys(FIRMALAR).filter(function(k){return FIRMALAR[k].durum==="beklemede";}).length;
  document.getElementById("nav").innerHTML=menu.map(function(m){
    var say = (m==="onay"&&bekSay) ? '<span class="count">'+bekSay+'</span>' : "";
    return '<button type="button" data-ek="'+m+'"'+((ekran===m)?' aria-current="true"':'')+'>'+
      '<span>'+esc(t.nav[m])+'</span>'+say+'</button>';
  }).join("");

  var fn = (ekran==="detay") ? ekranDetay : EKRANLAR[ekran];
  document.getElementById("view").innerHTML = fn ? fn() : "";

  if(ekran==="qr") qrCiz();
}

function qrCiz(){
  var c=document.getElementById("qrC"); if(!c) return;
  var adres="https://yukagi.com/f/pamukkale-lojistik?k="+qrTok;
  if(typeof QRious==="function"){
    try{ new QRious({element:c, value:adres, size:352, level:"M", background:"#ffffff", foreground:"#0E1613"}); return; }catch(e){}
  }
  var g=c.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
  g.fillStyle="#56635B"; g.font="12px sans-serif"; g.textAlign="center";
  g.fillText(lang==="tr"?"QR görseli yüklenemedi":"QR image unavailable", c.width/2, c.height/2);
}

/* ===================== olaylar ===================== */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-ek],[data-ac]"); if(!b) return;

  if(b.dataset.ek){ ekran=b.dataset.ek; acikIlan=null; teklifFormu=null; ciz(); window.scrollTo({top:0,behavior:"instant"}); return; }

  var ac=b.dataset.ac, t=T();
  if(ac==="ac"){ acikIlan=b.dataset.id; ekran="detay"; teklifFormu=null; ciz(); window.scrollTo({top:0,behavior:"instant"}); return; }
  if(ac==="geri"){ ekran = MENU[rol].indexOf("bul")>=0 ? "bul" : "ilanlar"; acikIlan=null; ciz(); return; }
  if(ac==="teklif"){ teklifFormu=b.dataset.id; ciz(); return; }
  if(ac==="iptal"){ teklifFormu=null; ciz(); return; }

  if(ac==="kabul"||ac==="red"){
    var id=b.dataset.id, fk=b.dataset.f;
    ILANLAR.forEach(function(i){
      if(i.id!==id) return;
      (i.teklifler||[]).forEach(function(tk){
        if(tk.firma===fk) tk.durum = (ac==="kabul") ? "kabul" : "red";
        else if(ac==="kabul" && tk.durum==="bekliyor") tk.durum="red";
      });
      if(ac==="kabul") i.durum="anlasildi";
    });
    toast(ac==="kabul"? t.kabulEdildi : t.tDurum.red);
    ciz(); return;
  }

  if(ac==="onayla"){
    var k=b.dataset.k;
    if(FIRMALAR[k]){ FIRMALAR[k].durum="onayli"; FIRMALAR[k].plan="Başlangıç"; FIRMALAR[k].deneme=30; }
    toast(t.firmaOnaylandi); ciz(); return;
  }
  if(ac==="qrdl"){ toast(t.indirKapali); return; }
  if(ac==="qrnew"){
    qrTok = Math.random().toString(16).slice(2,10);
    toast(t.qrYenilendi); ciz(); return;
  }
});

document.addEventListener("submit",function(e){
  e.preventDefault();
  var t=T();
  if(e.target.id==="filtreForm"){
    filtre.to=document.getElementById("fTo").value;
    filtre.dorse=document.getElementById("fD").value;
    filtre.sort=document.getElementById("fS").value;
    ciz(); return;
  }
  if(e.target.id==="teklifForm"){
    var tutar=Number(document.getElementById("tfT").value)||0;
    var not=document.getElementById("tfN").value.trim();
    ILANLAR.forEach(function(i){
      if(i.id!==teklifFormu) return;
      i.teklifler=(i.teklifler||[]).concat([{firma:benimFirmam(), tutar:tutar, durum:"bekliyor",
        not:{tr:not||"—", en:not||"—"}}]);
    });
    teklifFormu=null; toast(t.teklifAlindi); ciz();
  }
});

document.getElementById("roleSel").addEventListener("change",function(){
  rol=this.value; ekran=MENU[rol][0]; acikIlan=null; teklifFormu=null; ciz();
  window.scrollTo({top:0,behavior:"instant"});
});

document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click",function(){
    lang=this.dataset.lang;
    try{ localStorage.setItem("ya_lang",lang); }catch(e){}
    document.querySelectorAll(".langs button").forEach(function(x){
      x.setAttribute("aria-pressed", String(x.dataset.lang===lang)); });
    ciz();
  });
});

ciz();
})();
</script>
